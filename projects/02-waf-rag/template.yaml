AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: WAF RAG - Well-Architected Framework RAG Query API

Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 1024
    Environment:
      Variables:
        EMBEDDINGS_BUCKET: ai-2026-project-lonestar
        EMBEDDINGS_KEY: projects/02-waf-rag/embeddings.json

Resources:

  WafRagApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: waf-rag-api
      StageName: prod
      Cors:
        AllowMethods: "'POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'https://ai.rus-teston.com'"
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 5

  WafRagFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: waf-rag-query
      CodeUri: lambda/
      Handler: query_handler.handler
      Description: WAF RAG query handler
      Policies:
        - S3ReadPolicy:
            BucketName: ai-2026-project-lonestar
        - Statement:
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:Converse
            Resource: "*"
      Events:
        QueryApi:
          Type: Api
          Properties:
            RestApiId: !Ref WafRagApi
            Path: /query
            Method: POST
        OptionsApi:
          Type: Api
          Properties:
            RestApiId: !Ref WafRagApi
            Path: /query
            Method: OPTIONS

Outputs:
  ApiUrl:
    Description: WAF RAG API endpoint
    Value: !Sub "https://${WafRagApi}.execute-api.us-east-1.amazonaws.com/prod/query"
